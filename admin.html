<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO-GROC Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #121212; color: #fff; padding-bottom: 40px; }
  header { background: #1A1A1A; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2A2A2A; gap: 8px; }
  .logo { color: #2ECC71; font-size: 20px; font-weight: 800; }
  .hdr-btns { display: flex; gap: 6px; align-items: center; }
  .tabs { display: flex; background: #1A1A1A; border-bottom: 1px solid #2A2A2A; }
  .tab { flex: 1; text-align: center; padding: 12px; font-weight: 700; font-size: 14px; color: #888; cursor: pointer; border-bottom: 3px solid transparent; }
  .tab.active { color: #2ECC71; border-bottom-color: #2ECC71; }
  .section { padding: 14px; display: none; }
  .section.active { display: block; }
  .card { background: #1E1E1E; border: 1px solid #2E2E2E; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge { background: #2ECC71; color: #000; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
  .status-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
  .st-btn { background: #2A2A2A; color: #ccc; border: 1px solid #3A3A3A; padding: 7px 4px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .st-btn.active { background: #2ECC71; color: #000; border-color: #2ECC71; }
  .action-row { display: flex; gap: 8px; }
  .btn-call { flex: 1; background: #F1C40F; color: #000; text-align: center; text-decoration: none; padding: 9px; border-radius: 8px; font-weight: 800; font-size: 13px; }
  .btn-del { flex: 1; background: #3A1E1E; color: #E74C3C; border: 1px solid #E74C3C; padding: 9px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .input-box { width: 100%; background: #262626; border: 1px solid #333; color: #fff; padding: 11px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-primary { width: 100%; background: #2ECC71; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; }
  .menu-row { display: flex; align-items: center; justify-content: space-between; background: #1E1E1E; border: 1px solid #2C2C2C; padding: 10px; border-radius: 10px; margin-bottom: 10px; gap: 8px; }
  .menu-thumb { width: 48px; height: 48px; border-radius: 8px; background: #262626; display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; flex-shrink: 0; margin-right: 10px; }
  .menu-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .toggle-btn { padding: 6px 9px; border-radius: 8px; border: none; font-weight: 700; font-size: 11px; cursor: pointer; }
  .inv-line { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .alert-banner { display: none; background: #DC2626; color: #fff; text-align: center; padding: 10px; font-weight: 800; font-size: 14px; }
  .var-box { background: #161616; border: 1px dashed #3A3A3A; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
  .var-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .var-row input { margin-bottom: 0; padding: 8px; font-size: 13px; }
  .var-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .q-chip { background: #262626; color: #93C5FD; border: 1px solid #3B82F6; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .cat-pill-row { display: flex; justify-content: space-between; align-items: center; background: #161616; border: 1px solid #2C2C2C; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; }
</style>
</head>
<body onclick="unlockAudio()">

<div id="newOrderBanner" class="alert-banner" onclick="this.style.display='none'">🚨 NEW ORDER RECEIVED! (Tap to dismiss)</div>

<header>
  <div>
    <div class="logo">GO-GROC</div>
    <div style="font-size:11px;color:#999;">ADMIN PANEL</div>
  </div>
  <div class="hdr-btns">
    <button id="soundToggleBtn" onclick="toggleSound(event)" style="background:#F1C40F;color:#000;border:none;padding:8px 10px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;">🔔 SOUND ON</button>
    <button id="storeToggleBtn" onclick="toggleStore()" style="background:#2ECC71;color:#000;border:none;padding:8px 12px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;">STORE OPEN</button>
  </div>
</header>

<div class="tabs">
  <div id="tabOrders" class="tab active" onclick="switchTab('orders')">LIVE ORDERS</div>
  <div id="tabMenu" class="tab" onclick="switchTab('menu')">MENU MANAGER</div>
</div>

<div id="ordersSection" class="section active">
  <div id="ordersList"><p style="text-align:center;color:#777;padding:30px;">Loading orders...</p></div>
</div>

<div id="menuSection" class="section">
  <!-- Category Manager Card -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 style="font-size:15px;">📁 Manage Categories</h3>
      <span onclick="toggleCatBox()" id="catToggleTxt" style="font-size:12px;color:#2ECC71;font-weight:700;cursor:pointer;">Hide ▴</span>
    </div>
    <div id="catManagerBody">
      <input type="hidden" id="editCatIdx" value="-1">
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <input type="text" id="catEmojiInp" class="input-box" placeholder="🍔" style="width:58px;text-align:center;margin-bottom:0;">
        <input type="text" id="catNameInp" class="input-box" placeholder="Category Name (e.g. Momos & Pasta)" style="flex:1;margin-bottom:0;">
        <button id="saveCatBtn" onclick="saveCategory()" style="background:#2ECC71;color:#000;border:none;padding:0 14px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;">Add</button>
      </div>
      <div id="catListAdmin"></div>
    </div>
  </div>

  <!-- Add / Edit Item Card -->
  <div class="card">
    <h3 id="formTitle" style="margin-bottom:10px;font-size:16px;">Add New Item</h3>
    <input type="hidden" id="editItemId" value="">
    <input type="text" id="itemName" class="input-box" placeholder="Item Name (e.g., Cold Coffee / Cheese Burger)">
    <select id="itemCategory" class="input-box"></select>
    <div class="row-2">
      <input type="number" id="itemMrp" class="input-box" placeholder="Base MRP ₹ (Optional)">
      <input type="number" id="itemPrice" class="input-box" placeholder="Base Price ₹ *">
    </div>
    <input type="text" id="itemDesc" class="input-box" placeholder="Short Description">

    <div class="var-box">
      <div style="font-size:12px;font-weight:800;color:#2ECC71;margin-bottom:6px;">Sizes / Custom Options (Optional)</div>
      <div class="var-quick">
        <span class="q-chip" onclick="addSML()">+ Small / Medium / Large</span>
        <span class="q-chip" onclick="addVariantRow('', '')">+ Custom Option (e.g. With Cheese)</span>
      </div>
      <div id="variantsContainer"></div>
    </div>

    <input type="file" id="itemPhoto" accept="image/*" class="input-box" onchange="compressImage(event)">
    <img id="previewImg" style="width:70px;height:70px;object-fit:cover;border-radius:8px;display:none;margin-bottom:10px;">
    <button id="addItemBtn" class="btn-primary" onclick="saveMenuItem()">Add Item to Menu</button>
    <button id="cancelEditBtn" onclick="resetForm()" style="display:none;width:100%;background:#333;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer;">Cancel Edit</button>
  </div>

  <h4 style="margin-bottom:10px;color:#ccc;">Current Menu Items (<span id="menuCount">0</span>)</h4>
  <div id="menuList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({ projectId: "go-groc-f488d" });
  var db = firebase.firestore();

  var DEFAULT_CATS = [
    { name: "Vegetables & Fruits", icon: "🥦" },
    { name: "Dairy & Bread", icon: "🥛" },
    { name: "Atta, Rice & Dal", icon: "🌾" },
    { name: "Snacks & Drinks", icon: "🍟" },
    { name: "Fast Food", icon: "🍔" },
    { name: "Daily Essentials", icon: "🧴" }
  ];

  var categoriesList = DEFAULT_CATS.slice();
  var storeOpen = true;
  var compressedBase64 = "";
  var currentEmoji = "";
  var allMenuDocs = [];

  var soundEnabled = true;
  var audioCtx = null;
  var initialOrdersLoaded = false;
  var knownOrderIds = {};

  function unlockAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function playLoudOrderBuzzer() {
    if (!soundEnabled) return;
    unlockAudio();
    if (!audioCtx) return;
    if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 600]);
    var now = audioCtx.currentTime;
    var freqs = [880, 1174.66, 880, 1174.66, 987.77, 1318.51];
    for (var i = 0; i < freqs.length; i++) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i], now + i * 0.22);
      gain.gain.setValueAtTime(0.001, now + i * 0.22);
      gain.gain.exponentialRampToValueAtTime(0.9, now + i * 0.22 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.20);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i * 0.22); osc.stop(now + i * 0.22 + 0.21);
    }
  }

  function toggleSound(e) {
    if (e) e.stopPropagation();
    soundEnabled = !soundEnabled;
    var btn = document.getElementById("soundToggleBtn");
    btn.textContent = soundEnabled ? "🔔 SOUND ON" : "🔕 MUTED";
    btn.style.background = soundEnabled ? "#F1C40F" : "#444";
    btn.style.color = soundEnabled ? "#000" : "#ccc";
    if (soundEnabled) playLoudOrderBuzzer();
  }

  // --- DYNAMIC CATEGORY MANAGEMENT ---
  function toggleCatBox() {
    var body = document.getElementById("catManagerBody");
    var txt = document.getElementById("catToggleTxt");
    if (body.style.display === "none") { body.style.display = "block"; txt.textContent = "Hide ▴"; }
    else { body.style.display = "none"; txt.textContent = "Show ▾"; }
  }

  function renderCategoryUI() {
    var sel = document.getElementById("itemCategory");
    var prevVal = sel.value;
    sel.innerHTML = categoriesList.map(function(c) {
      return '<option value="' + c.name + '">' + c.icon + ' ' + c.name + '</option>';
    }).join("");
    if (prevVal && categoriesList.some(function(c) { return c.name === prevVal; })) sel.value = prevVal;

    document.getElementById("catListAdmin").innerHTML = categoriesList.map(function(c, idx) {
      return '<div class="cat-pill-row">' +
        '<div style="font-size:13px;font-weight:700;">' + c.icon + ' ' + c.name + '</div>' +
        '<div style="display:flex;gap:5px;">' +
          '<button class="toggle-btn" style="background:#2563EB;color:#fff;" onclick="editCategory(' + idx + ')">Edit</button>' +
          '<button class="toggle-btn" style="background:#3A1E1E;color:#E74C3C;" onclick="deleteCategory(' + idx + ')">Del</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  function editCategory(idx) {
    var c = categoriesList[idx];
    if (!c) return;
    document.getElementById("editCatIdx").value = idx;
    document.getElementById("catEmojiInp").value = c.icon;
    document.getElementById("catNameInp").value = c.name;
    document.getElementById("saveCatBtn").textContent = "Update";
  }

  function saveCategory() {
    var idx = Number(document.getElementById("editCatIdx").value);
    var icon = document.getElementById("catEmojiInp").value.trim() || "📦";
    var name = document.getElementById("catNameInp").value.trim();
    if (!name) { alert("Enter category name!"); return; }

    var updated = categoriesList.slice();
    var oldName = "";
    if (idx >= 0 && updated[idx]) {
      oldName = updated[idx].name;
      updated[idx] = { name: name, icon: icon };
    } else {
      updated.push({ name: name, icon: icon });
    }

    db.collection("settings").doc("categories").set({ list: updated }).then(function() {
      if (oldName && oldName !== name) {
        var batch = db.batch();
        allMenuDocs.forEach(function(m) {
          if (m.category === oldName) batch.update(db.collection("menu").doc(m.id), { category: name });
        });
        batch.commit();
      }
      document.getElementById("editCatIdx").value = "-1";
      document.getElementById("catEmojiInp").value = "";
      document.getElementById("catNameInp").value = "";
      document.getElementById("saveCatBtn").textContent = "Add";
    });
  }

  function deleteCategory(idx) {
    if (categoriesList.length <= 1) { alert("At least 1 category is required!"); return; }
    var c = categoriesList[idx];
    if (!confirm("Delete category '" + c.name + "'?")) return;
    var updated = categoriesList.filter(function(_, i) { return i !== idx; });
    db.collection("settings").doc("categories").set({ list: updated });
  }

  db.collection("settings").doc("categories").onSnapshot(function(snap) {
    if (snap.exists && Array.isArray(snap.data().list) && snap.data().list.length) {
      categoriesList = snap.data().list;
    } else {
      categoriesList = DEFAULT_CATS.slice();
      db.collection("settings").doc("categories").set({ list: categoriesList });
    }
    renderCategoryUI();
  });

  function addVariantRow(label, price, mrp) {
    var box = document.getElementById("variantsContainer");
    var row = document.createElement("div");
    row.className = "var-row";
    row.innerHTML =
      '<input type="text" class="input-box v-lbl" placeholder="Option (e.g. Large / With Cheese)" value="' + (label || "") + '" style="flex:2">' +
      '<input type="number" class="input-box v-prc" placeholder="Price ₹" value="' + (price || "") + '" style="flex:1">' +
      '<input type="number" class="input-box v-mrp" placeholder="MRP" value="' + (mrp || "") + '" style="flex:1">' +
      '<button type="button" onclick="this.parentElement.remove()" style="background:#3A1E1E;color:#E74C3C;border:none;padding:8px 10px;border-radius:8px;font-weight:800;cursor:pointer;">✕</button>';
    box.appendChild(row);
  }

  function addSML() {
    var base = Number(document.getElementById("itemPrice").value) || "";
    addVariantRow("Small", base, "");
    addVariantRow("Medium", base ? base + 20 : "", "");
    addVariantRow("Large", base ? base + 40 : "", "");
  }

  function getVariantsFromForm() {
    var rows = document.querySelectorAll("#variantsContainer .var-row");
    var list = [];
    rows.forEach(function(r) {
      var lbl = r.querySelector(".v-lbl").value.trim();
      var prc = Number(r.querySelector(".v-prc").value);
      var mrp = Number(r.querySelector(".v-mrp").value) || 0;
      if (lbl && prc > 0) list.push({ label: lbl, price: prc, mrp: mrp });
    });
    return list;
  }

  function switchTab(t) {
    document.getElementById("tabOrders").className = t === "orders" ? "tab active" : "tab";
    document.getElementById("tabMenu").className = t === "menu" ? "tab active" : "tab";
    document.getElementById("ordersSection").className = t === "orders" ? "section active" : "section";
    document.getElementById("menuSection").className = t === "menu" ? "section active" : "section";
  }

  db.collection("settings").doc("store").onSnapshot(function(snap) {
    storeOpen = snap.exists ? snap.data().isOpen !== false : true;
    var btn = document.getElementById("storeToggleBtn");
    btn.textContent = storeOpen ? "STORE OPEN" : "STORE CLOSED";
    btn.style.background = storeOpen ? "#2ECC71" : "#E74C3C";
    btn.style.color = storeOpen ? "#000" : "#fff";
  });

  function toggleStore() { db.collection("settings").doc("store").set({ isOpen: !storeOpen }, { merge: true }); }

  db.collection("orders").orderBy("createdAt", "desc").onSnapshot(function(snap) {
    var hasNewOrder = false;
    snap.docs.forEach(function(d) {
      if (!knownOrderIds[d.id]) {
        knownOrderIds[d.id] = true;
        if (initialOrdersLoaded) hasNewOrder = true;
      }
    });
    initialOrdersLoaded = true;
    if (hasNewOrder) {
      playLoudOrderBuzzer();
      document.getElementById("newOrderBanner").style.display = "block";
      switchTab("orders");
    }
    var container = document.getElementById("ordersList");
    if (snap.empty) { container.innerHTML = '<p style="text-align:center;color:#777;padding:30px;">No orders yet.</p>'; return; }
    container.innerHTML = snap.docs.map(function(d) {
      var o = d.data();
      var itemsHtml = (o.items || []).map(function(i) {
        return '<div class="inv-line"><span>' + i.qty + 'x ' + i.name + ' (₹' + i.price + ')</span><b>₹' + (i.price * i.qty) + '</b></div>';
      }).join("");
      var delFee = (typeof o.deliveryCharge === "number") ? o.deliveryCharge : 0;
      var delHtml = delFee > 0 ? '<div class="inv-line" style="color:#aaa;border-top:1px dashed #333;margin-top:4px;padding-top:4px;"><span>Delivery Charge</span><span>₹' + delFee + '</span></div>' : '';
      var statuses = ["Placed", "Preparing", "Out for Delivery", "Completed"];
      return '<div class="card">' +
        '<div class="order-top"><b>#' + d.id.slice(0,6).toUpperCase() + '</b><span class="badge">' + (o.status || "Placed") + '</span></div>' +
        '<div style="font-size:14px;margin-bottom:4px;"><b>' + o.customerName + '</b> (' + o.phone + ')</div>' +
        '<div style="font-size:12px;color:#aaa;margin-bottom:10px;">📍 ' + o.address + '</div>' +
        '<div style="background:#161616;padding:10px;border-radius:8px;margin-bottom:8px;">' + itemsHtml + delHtml + '</div>' +
        '<div style="font-size:16px;font-weight:800;color:#2ECC71;text-align:right;">Grand Total: ₹' + o.total + '</div>' +
        '<div class="status-btns">' + statuses.map(function(s) { return '<button class="st-btn ' + (o.status === s ? 'active' : '') + '" onclick="setOrderStatus(\'' + d.id + '\',\'' + s + '\')">' + s + '</button>'; }).join("") + '</div>' +
        '<div class="action-row"><a href="tel:' + o.phone + '" class="btn-call">CALL CUSTOMER</a><button class="btn-del" onclick="removeOrder(\'' + d.id + '\')">DELETE</button></div>' +
      '</div>';
    }).join("");
  });

  function setOrderStatus(id, status) { db.collection("orders").doc(id).update({ status: status }); }
  function removeOrder(id) { if (confirm("Delete this order permanently?")) db.collection("orders").doc(id).delete(); }

  function compressImage(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement("canvas");
        var scale = 320 / img.width;
        canvas.width = 320; canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        compressedBase64 = canvas.toDataURL("image/jpeg", 0.65);
        var prev = document.getElementById("previewImg");
        prev.src = compressedBase64; prev.style.display = "block";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function editMenu(id) {
    var m = allMenuDocs.find(function(x) { return x.id === id; });
    if (!m) return;
    document.getElementById("editItemId").value = id;
    document.getElementById("formTitle").textContent = "✏️ Edit Item";
    document.getElementById("itemName").value = m.name || "";
    document.getElementById("itemCategory").value = m.category || (categoriesList[0] ? categoriesList[0].name : "");
    document.getElementById("itemMrp").value = m.mrp || "";
    document.getElementById("itemPrice").value = m.price || "";
    document.getElementById("itemDesc").value = m.desc || "";
    document.getElementById("variantsContainer").innerHTML = "";
    (m.variants || []).forEach(function(v) { addVariantRow(v.label, v.price, v.mrp); });
    compressedBase64 = m.image || "";
    currentEmoji = m.emoji || "🛒";
    var prev = document.getElementById("previewImg");
    if (compressedBase64) { prev.src = compressedBase64; prev.style.display = "block"; }
    else { prev.style.display = "none"; }
    document.getElementById("addItemBtn").textContent = "Save Changes";
    document.getElementById("cancelEditBtn").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    document.getElementById("editItemId").value = "";
    document.getElementById("formTitle").textContent = "Add New Item";
    document.getElementById("itemName").value = "";
    document.getElementById("itemMrp").value = "";
    document.getElementById("itemPrice").value = "";
    document.getElementById("itemDesc").value = "";
    document.getElementById("variantsContainer").innerHTML = "";
    document.getElementById("itemPhoto").value = "";
    document.getElementById("previewImg").style.display = "none";
    document.getElementById("addItemBtn").textContent = "Add Item to Menu";
    document.getElementById("cancelEditBtn").style.display = "none";
    compressedBase64 = ""; currentEmoji = "";
  }

  function saveMenuItem() {
    var editId = document.getElementById("editItemId").value;
    var name = document.getElementById("itemName").value.trim();
    var category = document.getElementById("itemCategory").value;
    var mrp = Number(document.getElementById("itemMrp").value) || 0;
    var price = Number(document.getElementById("itemPrice").value);
    var desc = document.getElementById("itemDesc").value.trim();
    var variants = getVariantsFromForm();
    if (!name || (!price && !variants.length)) { alert("Please enter item name and price!"); return; }
    if (!price && variants.length) price = variants[0].price;

    var btn = document.getElementById("addItemBtn");
    btn.disabled = true; btn.textContent = "Saving...";
    var data = { name: name, category: category, mrp: mrp, price: price, desc: desc, variants: variants, image: compressedBase64, emoji: currentEmoji || "🛒" };

    var op = editId
      ? db.collection("menu").doc(editId).update(data)
      : db.collection("menu").add(Object.assign(data, { inStock: true }));

    op.then(function() { resetForm(); btn.disabled = false; })
      .catch(function(e) { alert("Error: " + e.message); btn.disabled = false; btn.textContent = editId ? "Save Changes" : "Add Item to Menu"; });
  }

  db.collection("menu").onSnapshot(function(snap) {
    allMenuDocs = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    document.getElementById("menuCount").textContent = allMenuDocs.length;
    document.getElementById("menuList").innerHTML = allMenuDocs.map(function(m) {
      var stock = m.inStock !== false;
      var vCount = (m.variants && m.variants.length) ? ' <span style="background:#1E3A8A;color:#93C5FD;font-size:10px;padding:1px 6px;border-radius:4px;">' + m.variants.length + ' options</span>' : '';
      var thumb = m.image ? '<img src="' + m.image + '">' : (m.emoji || "🛒");
      return '<div class="menu-row">' +
        '<div style="display:flex;align-items:center;flex:1;min-width:0;">' +
          '<div class="menu-thumb">' + thumb + '</div>' +
          '<div style="min-width:0;">' +
            '<div style="font-size:10px;color:#2ECC71;font-weight:700;">' + (m.category || "Daily Essentials") + vCount + '</div>' +
            '<div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + m.name + '</div>' +
            '<div style="color:#2ECC71;font-weight:700;font-size:13px;">₹' + m.price + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:5px;flex-shrink:0;">' +
          '<button class="toggle-btn" style="background:#2563EB;color:#fff;" onclick="editMenu(\'' + m.id + '\')">Edit</button>' +
          '<button class="toggle-btn" style="background:' + (stock ? '#2ECC71' : '#555') + ';color:' + (stock ? '#000' : '#fff') + '" onclick="toggleStock(\'' + m.id + '\', ' + stock + ')">' + (stock ? 'In' : 'Out') + '</button>' +
          '<button class="toggle-btn" style="background:#3A1E1E;color:#E74C3C;" onclick="deleteMenu(\'' + m.id + '\')">Del</button>' +
        '</div>' +
      '</div>';
    }).join("");
  });

  function toggleStock(id, current) { db.collection("menu").doc(id).update({ inStock: !current }); }
  function deleteMenu(id) { if (confirm("Delete this item from menu?")) db.collection("menu").doc(id).delete(); }

  renderCategoryUI();
</script>
</body>
</html>
