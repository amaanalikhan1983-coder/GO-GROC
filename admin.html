<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO-GROC Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #121212; color: #fff; padding-bottom: 40px; }
  header { background: #1A1A1A; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2A2A2A; }
  .logo { color: #2ECC71; font-size: 20px; font-weight: 800; }
  .tabs { display: flex; background: #1A1A1A; border-bottom: 1px solid #2A2A2A; }
  .tab { flex: 1; text-align: center; padding: 12px; font-weight: 700; font-size: 14px; color: #888; cursor: pointer; border-bottom: 3px solid transparent; }
  .tab.active { color: #2ECC71; border-bottom-color: #2ECC71; }
  .section { padding: 14px; display: none; }
  .section.active { display: block; }
  .card { background: #1E1E1E; border: 1px solid #2E2E2E; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge { background: #2ECC71; color: #000; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
  .status-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
  .st-btn { background: #2A2A2A; color: #ccc; border: 1px solid #3A3A3A; padding: 7px 4px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .st-btn.active { background: #2ECC71; color: #000; border-color: #2ECC71; }
  .action-row { display: flex; gap: 8px; }
  .btn-call { flex: 1; background: #F1C40F; color: #000; text-align: center; text-decoration: none; padding: 9px; border-radius: 8px; font-weight: 800; font-size: 13px; }
  .btn-del { flex: 1; background: #3A1E1E; color: #E74C3C; border: 1px solid #E74C3C; padding: 9px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .input-box { width: 100%; background: #262626; border: 1px solid #333; color: #fff; padding: 11px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-primary { width: 100%; background: #2ECC71; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; }
  .btn-import { width: 100%; background: #1E3A8A; color: #93C5FD; border: 1px dashed #3B82F6; padding: 11px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; margin-bottom: 14px; }
  .menu-row { display: flex; align-items: center; justify-content: space-between; background: #1E1E1E; border: 1px solid #2C2C2C; padding: 10px; border-radius: 10px; margin-bottom: 10px; gap: 8px; }
  .menu-thumb { width: 48px; height: 48px; border-radius: 8px; background: #262626; display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; flex-shrink: 0; margin-right: 10px; }
  .menu-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .toggle-btn { padding: 6px 9px; border-radius: 8px; border: none; font-weight: 700; font-size: 11px; cursor: pointer; }
  .inv-line { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">GO-GROC</div>
    <div style="font-size:11px;color:#999;">ADMIN PANEL</div>
  </div>
  <button id="storeToggleBtn" onclick="toggleStore()" style="background:#2ECC71;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:800;font-size:12px;">STORE OPEN</button>
</header>

<div class="tabs">
  <div id="tabOrders" class="tab active" onclick="switchTab('orders')">LIVE ORDERS</div>
  <div id="tabMenu" class="tab" onclick="switchTab('menu')">MENU MANAGER</div>
</div>

<div id="ordersSection" class="section active">
  <div id="ordersList"><p style="text-align:center;color:#777;padding:30px;">Loading orders...</p></div>
</div>

<div id="menuSection" class="section">
  <button id="importBtn" class="btn-import" onclick="importStarterItems()">⚡ Import All 20 Starter Items to Edit Here</button>

  <div class="card">
    <h3 id="formTitle" style="margin-bottom:10px;font-size:16px;">Add New Item</h3>
    <input type="hidden" id="editItemId" value="">
    <input type="text" id="itemName" class="input-box" placeholder="Item Name (e.g., Fresh Onions 1kg)">
    <select id="itemCategory" class="input-box">
      <option value="Vegetables & Fruits">Vegetables & Fruits</option>
      <option value="Dairy & Bread">Dairy & Bread</option>
      <option value="Atta, Rice & Dal">Atta, Rice & Dal</option>
      <option value="Snacks & Drinks">Snacks & Drinks</option>
      <option value="Fast Food">Fast Food</option>
      <option value="Daily Essentials">Daily Essentials</option>
    </select>
    <div class="row-2">
      <input type="number" id="itemMrp" class="input-box" placeholder="MRP ₹ (Optional, e.g. 60)">
      <input type="number" id="itemPrice" class="input-box" placeholder="Selling Price ₹ * (e.g. 40)">
    </div>
    <input type="text" id="itemDesc" class="input-box" placeholder="Short Description">
    <input type="file" id="itemPhoto" accept="image/*" class="input-box" onchange="compressImage(event)">
    <img id="previewImg" style="width:70px;height:70px;object-fit:cover;border-radius:8px;display:none;margin-bottom:10px;">
    <button id="addItemBtn" class="btn-primary" onclick="saveMenuItem()">Add Item to Menu</button>
    <button id="cancelEditBtn" onclick="resetForm()" style="display:none;width:100%;background:#333;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer;">Cancel Edit</button>
  </div>

  <h4 style="margin-bottom:10px;color:#ccc;">Current Menu Items (<span id="menuCount">0</span>)</h4>
  <div id="menuList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({ projectId: "go-groc-f488d" });
  var db = firebase.firestore();

  var storeOpen = true;
  var compressedBase64 = "";
  var currentEmoji = "";
  var allMenuDocs = [];

  var STARTER_ITEMS = [
    { name: "Fresh Aloo (Potato) 1 kg", category: "Vegetables & Fruits", mrp: 40, price: 28, emoji: "🥔", desc: "Farm fresh sorted potatoes" },
    { name: "Red Onion (Pyaz) 1 kg", category: "Vegetables & Fruits", mrp: 45, price: 32, emoji: "🧅", desc: "Fresh Nashik red onions" },
    { name: "Desi Tomato 500 g", category: "Vegetables & Fruits", mrp: 30, price: 20, emoji: "🍅", desc: "Juicy red tomatoes" },
    { name: "Fresh Banana (6 pcs)", category: "Vegetables & Fruits", mrp: 45, price: 35, emoji: "🍌", desc: "Ripe sweet bananas" },
    { name: "Saras Gold Full Cream Milk 1L", category: "Dairy & Bread", mrp: 68, price: 66, emoji: "🥛", desc: "Fresh pasteurized milk" },
    { name: "Fresh Dahi (Curd) 400 g", category: "Dairy & Bread", mrp: 40, price: 35, emoji: "🥣", desc: "Thick & creamy curd" },
    { name: "White Sandwich Bread", category: "Dairy & Bread", mrp: 45, price: 40, emoji: "🍞", desc: "Soft freshly baked bread" },
    { name: "Amul Pasteurised Butter 100g", category: "Dairy & Bread", mrp: 60, price: 56, emoji: "🧈", desc: "Utterly butterly delicious" },
    { name: "Aashirvaad Shudh Chakki Atta 5kg", category: "Atta, Rice & Dal", mrp: 265, price: 235, emoji: "🌾", desc: "100% whole wheat flour" },
    { name: "Basmati Rice 1 kg", category: "Atta, Rice & Dal", mrp: 110, price: 89, emoji: "🍚", desc: "Long grain aromatic rice" },
    { name: "Toor / Arhar Dal 1 kg", category: "Atta, Rice & Dal", mrp: 175, price: 155, emoji: "🫘", desc: "Unpolished protein-rich dal" },
    { name: "Fortune Refined Soyabean Oil 1L", category: "Atta, Rice & Dal", mrp: 145, price: 129, emoji: "🫗", desc: "Light & healthy cooking oil" },
    { name: "Lay's Classic Salted Chips", category: "Snacks & Drinks", mrp: 20, price: 20, emoji: "🍟", desc: "Crispy potato chips pack" },
    { name: "Coca-Cola Cold Drink 750 ml", category: "Snacks & Drinks", mrp: 45, price: 40, emoji: "🥤", desc: "Chilled refreshing drink" },
    { name: "Parle-G Gold Biscuits Pack", category: "Snacks & Drinks", mrp: 30, price: 28, emoji: "🍪", desc: "Crunchy tea-time biscuits" },
    { name: "Aloo Tikki Burger", category: "Fast Food", mrp: 60, price: 40, emoji: "🍔", desc: "Crispy aloo patty, onion, tomato & creamy mayo" },
    { name: "Veg Cheese Grilled Sandwich", category: "Fast Food", mrp: 80, price: 60, emoji: "🥪", desc: "Loaded veggies with melted cheese" },
    { name: "Cold Coffee (300 ml)", category: "Fast Food", mrp: 70, price: 55, emoji: "🧋", desc: "Thick creamy chilled coffee" },
    { name: "Tata Iodized Salt 1 kg", category: "Daily Essentials", mrp: 28, price: 26, emoji: "🧂", desc: "Desh ka namak" },
    { name: "Surf Excel Detergent Bar (Pack of 3)", category: "Daily Essentials", mrp: 90, price: 78, emoji: "🧼", desc: "Tough stain removal" }
  ];

  function switchTab(t) {
    document.getElementById("tabOrders").className = t === "orders" ? "tab active" : "tab";
    document.getElementById("tabMenu").className = t === "menu" ? "tab active" : "tab";
    document.getElementById("ordersSection").className = t === "orders" ? "section active" : "section";
    document.getElementById("menuSection").className = t === "menu" ? "section active" : "section";
  }

  db.collection("settings").doc("store").onSnapshot(function(snap) {
    storeOpen = snap.exists ? snap.data().isOpen !== false : true;
    var btn = document.getElementById("storeToggleBtn");
    btn.textContent = storeOpen ? "STORE OPEN" : "STORE CLOSED";
    btn.style.background = storeOpen ? "#2ECC71" : "#E74C3C";
    btn.style.color = storeOpen ? "#000" : "#fff";
  });

  function toggleStore() {
    db.collection("settings").doc("store").set({ isOpen: !storeOpen }, { merge: true });
  }

  db.collection("orders").orderBy("createdAt", "desc").onSnapshot(function(snap) {
    var container = document.getElementById("ordersList");
    if (snap.empty) {
      container.innerHTML = '<p style="text-align:center;color:#777;padding:30px;">No orders yet.</p>';
      return;
    }
    container.innerHTML = snap.docs.map(function(d) {
      var o = d.data();
      var itemsHtml = (o.items || []).map(function(i) {
        return '<div class="inv-line"><span>' + i.qty + 'x ' + i.name + ' (₹' + i.price + ')</span><b>₹' + (i.price * i.qty) + '</b></div>';
      }).join("");
      var delFee = (typeof o.deliveryCharge === "number") ? o.deliveryCharge : 0;
      var delHtml = delFee > 0 ? '<div class="inv-line" style="color:#aaa;border-top:1px dashed #333;margin-top:4px;padding-top:4px;"><span>Delivery Charge</span><span>₹' + delFee + '</span></div>' : '';
      var statuses = ["Placed", "Preparing", "Out for Delivery", "Completed"];
      var doorPhotoHtml = o.doorPhoto ? '<img src="' + o.doorPhoto + '" style="width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-bottom:10px;border:1px solid #333;">' : "";
      return '<div class="card">' +
        '<div class="order-top"><b>#' + d.id.slice(0,6).toUpperCase() + '</b><span class="badge">' + (o.status || "Placed") + '</span></div>' +
        '<div style="font-size:14px;margin-bottom:4px;"><b>' + o.customerName + '</b> (' + o.phone + ')</div>' +
        '<div style="font-size:12px;color:#aaa;margin-bottom:10px;">📍 ' + o.address + '</div>' +
        doorPhotoHtml +
        '<div style="background:#161616;padding:10px;border-radius:8px;margin-bottom:8px;">' + itemsHtml + delHtml + '</div>' +
        '<div style="font-size:16px;font-weight:800;color:#2ECC71;text-align:right;">Grand Total: ₹' + o.total + '</div>' +
        '<div class="status-btns">' + statuses.map(function(s) { return '<button class="st-btn ' + (o.status === s ? 'active' : '') + '" onclick="setOrderStatus(\'' + d.id + '\',\'' + s + '\')">' + s + '</button>'; }).join("") + '</div>' +
        '<div class="action-row"><a href="tel:' + o.phone + '" class="btn-call">CALL CUSTOMER</a><button class="btn-del" onclick="removeOrder(\'' + d.id + '\')">DELETE</button></div>' +
      '</div>';
    }).join("");
  });

  function setOrderStatus(id, status) { db.collection("orders").doc(id).update({ status: status }); }
  function removeOrder(id) { if (confirm("Delete this order permanently?")) db.collection("orders").doc(id).delete(); }

  function importStarterItems() {
    var btn = document.getElementById("importBtn");
    btn.disabled = true; btn.textContent = "Importing 20 items...";
    var batch = db.batch();
    STARTER_ITEMS.forEach(function(item) {
      var ref = db.collection("menu").doc();
      batch.set(ref, Object.assign({}, item, { image: "", inStock: true }));
    });
    batch.commit().then(function() {
      btn.textContent = "✓ All 20 Items Imported!";
      setTimeout(function() { btn.disabled = false; btn.textContent = "⚡ Import All 20 Starter Items to Edit Here"; }, 2500);
    }).catch(function(e) {
      alert("Error: " + e.message);
      btn.disabled = false; btn.textContent = "⚡ Import All 20 Starter Items to Edit Here";
    });
  }

  function compressImage(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement("canvas");
        var scale = 320 / img.width;
        canvas.width = 320; canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        compressedBase64 = canvas.toDataURL("image/jpeg", 0.65);
        var prev = document.getElementById("previewImg");
        prev.src = compressedBase64; prev.style.display = "block";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function editMenu(id) {
    var m = allMenuDocs.find(function(x) { return x.id === id; });
    if (!m) return;
    document.getElementById("editItemId").value = id;
    document.getElementById("formTitle").textContent = "✏️ Edit Item";
    document.getElementById("itemName").value = m.name || "";
    document.getElementById("itemCategory").value = m.category || "Daily Essentials";
    document.getElementById("itemMrp").value = m.mrp || "";
    document.getElementById("itemPrice").value = m.price || "";
    document.getElementById("itemDesc").value = m.desc || "";
    compressedBase64 = m.image || "";
    currentEmoji = m.emoji || "🛒";
    var prev = document.getElementById("previewImg");
    if (compressedBase64) { prev.src = compressedBase64; prev.style.display = "block"; }
    else { prev.style.display = "none"; }
    document.getElementById("addItemBtn").textContent = "Save Changes";
    document.getElementById("cancelEditBtn").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    document.getElementById("editItemId").value = "";
    document.getElementById("formTitle").textContent = "Add New Item";
    document.getElementById("itemName").value = "";
    document.getElementById("itemMrp").value = "";
    document.getElementById("itemPrice").value = "";
    document.getElementById("itemDesc").value = "";
    document.getElementById("itemPhoto").value = "";
    document.getElementById("previewImg").style.display = "none";
    document.getElementById("addItemBtn").textContent = "Add Item to Menu";
    document.getElementById("cancelEditBtn").style.display = "none";
    compressedBase64 = "";
    currentEmoji = "";
  }

  function saveMenuItem() {
    var editId = document.getElementById("editItemId").value;
    var name = document.getElementById("itemName").value.trim();
    var category = document.getElementById("itemCategory").value;
    var mrp = Number(document.getElementById("itemMrp").value) || 0;
    var price = Number(document.getElementById("itemPrice").value);
    var desc = document.getElementById("itemDesc").value.trim();
    if (!name || !price) { alert("Please enter item name and selling price!"); return; }

    var btn = document.getElementById("addItemBtn");
    btn.disabled = true; btn.textContent = "Saving...";
    var data = { name: name, category: category, mrp: mrp, price: price, desc: desc, image: compressedBase64, emoji: currentEmoji || "🛒" };

    var op = editId
      ? db.collection("menu").doc(editId).update(data)
      : db.collection("menu").add(Object.assign(data, { inStock: true }));

    op.then(function() {
      resetForm();
      btn.disabled = false;
    }).catch(function(e) {
      alert("Error: " + e.message);
      btn.disabled = false; btn.textContent = editId ? "Save Changes" : "Add Item to Menu";
    });
  }

  db.collection("menu").onSnapshot(function(snap) {
    allMenuDocs = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    document.getElementById("menuCount").textContent = allMenuDocs.length;
    document.getElementById("menuList").innerHTML = allMenuDocs.map(function(m) {
      var stock = m.inStock !== false;
      var mrpTxt = m.mrp > m.price ? '<span style="text-decoration:line-through;color:#888;font-size:11px;margin-right:4px;">₹' + m.mrp + '</span>' : "";
      var thumb = m.image ? '<img src="' + m.image + '">' : (m.emoji || "🛒");
      return '<div class="menu-row">' +
        '<div style="display:flex;align-items:center;flex:1;min-width:0;">' +
          '<div class="menu-thumb">' + thumb + '</div>' +
          '<div style="min-width:0;">' +
            '<div style="font-size:10px;color:#2ECC71;font-weight:700;">' + (m.category || "Daily Essentials") + '</div>' +
            '<div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + m.name + '</div>' +
            '<div style="color:#2ECC71;font-weight:700;font-size:13px;">' + mrpTxt + '₹' + m.price + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:5px;flex-shrink:0;">' +
          '<button class="toggle-btn" style="background:#2563EB;color:#fff;" onclick="editMenu(\'' + m.id + '\')">Edit</button>' +
          '<button class="toggle-btn" style="background:' + (stock ? '#2ECC71' : '#555') + ';color:' + (stock ? '#000' : '#fff') + '" onclick="toggleStock(\'' + m.id + '\', ' + stock + ')">' + (stock ? 'In' : 'Out') + '</button>' +
          '<button class="toggle-btn" style="background:#3A1E1E;color:#E74C3C;" onclick="deleteMenu(\'' + m.id + '\')">Del</button>' +
        '</div>' +
      '</div>';
    }).join("");
  });

  function toggleStock(id, current) { db.collection("menu").doc(id).update({ inStock: !current }); }
  function deleteMenu(id) { if (confirm("Delete this item from menu?")) db.collection("menu").doc(id).delete(); }
</script>
</body>
</html>
